<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
     <link rel="stylesheet" href="style.css">
</head>
<body id="register-page-body">
     <nav>
        <h1><a href="home.html">tan_blog</a></h1>
        <a href="./login.html">login</a>
        <a href="./register.html">register</a>
        <a href="./create_blog.html">create blog</a>
        <a href="./dashboard.html">dashboard</a>
        <br>
        
    </nav>
    <h2 id="register-heading">Create your account</h2>
    <div class="register-container">
    <form id="RegisterForm">
        <div class="register-card">
        <label for="name">Name:
            <input class="register-input" id="name" type="text" name="name" placeholder="enter your name">
        </label><br><br>
        <label for="email">Email:
            <input class="register-input" id="email"    type="email" placeholder="enter email" name="email">
        </label><br><br>
        <label for="password">Password:
            <input   class="register-input" id="password" type="password" placeholder="enter password">
            <br><br>
            Confirm Password:<input class="register-input" id="confirmPassword"  type="password" placeholder="confirm password">
        </label><br><br>
        <button id="register-button" type="submit" >Register</button>
        <p>Already have an account?<b><a id="login-link" href="login.html">Login</a></b></p>
        </div>
    </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
